name: Release StreamDock plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: live-dashboard/plugin-src/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: live-dashboard/plugin-src
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: live-dashboard/plugin-src
        run: pnpm test
      - name: Build plugin backend
        working-directory: live-dashboard/plugin-src
        run: pnpm run build
      - name: Package release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            ./scripts/package-release.ps1 -Version "${{ github.ref_name }}"
          } else {
            ./scripts/package-release.ps1
          }
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdock-twitch-dashboard
          path: dist/*.zip
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
