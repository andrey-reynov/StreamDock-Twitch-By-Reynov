<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Arial;color:#eee;background:#252525;margin:14px}h2{font-size:16px}.row{display:flex;gap:8px}.field{flex:1}label{display:block;margin:10px 0 5px;font-weight:700}input,button{box-sizing:border-box;width:100%;padding:8px;border-radius:5px}input{background:#444;color:#fff;border:1px solid #666}button{margin-top:14px;border:0;background:#9146ff;color:#fff;font-weight:700}.hint,#status{margin-top:9px;color:#bbb;line-height:1.4}</style></head><body data-mode="timer"><h2>Countdown Timer</h2><label for="customTitle">Custom title</label><input id="customTitle" type="text" maxlength="40" placeholder="TIMER"><div class="hint">Press the key to start, pause, or resume. After zero it continues below zero and turns red. Saving resets the timer.</div><div class="row"><div class="field"><label for="hours">Hours</label><input id="hours" type="number" min="0" value="0"></div><div class="field"><label for="minutes">Minutes</label><input id="minutes" type="number" min="0" max="59" value="5"></div><div class="field"><label for="seconds">Seconds</label><input id="seconds" type="number" min="0" max="59" value="0"></div></div><button id="save">Save &amp; reset timer</button><div id="status"></div><script src="action-settings.js"></script></body></html>
