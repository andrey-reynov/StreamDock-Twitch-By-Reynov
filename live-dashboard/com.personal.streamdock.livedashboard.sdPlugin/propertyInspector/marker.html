<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Arial;color:#eee;background:#252525;margin:14px}h2{font-size:16px}label{display:block;margin:12px 0 5px;font-weight:700}input,button{box-sizing:border-box;width:100%;padding:8px;border-radius:5px}input{background:#444;color:#fff;border:1px solid #666}button{margin-top:14px;border:0;background:#9146ff;color:#fff;font-weight:700}.hint,#status{margin-top:9px;color:#bbb;line-height:1.4}</style></head><body data-mode="marker"><h2>Moment Marker</h2><label for="customTitle">Custom title</label><input id="customTitle" type="text" maxlength="40" placeholder="MOMENT"><div class="hint">While Twitch is live, creates a VOD marker. While OBS is recording, also creates a recording chapter. Twitch requires reconnecting once to grant marker permission.</div><label for="description">Optional marker description (max 140)</label><input id="description" maxlength="140" placeholder="Interesting moment"><button id="save">Save description</button><div id="status"></div><script src="action-settings.js"></script></body></html>
